name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: 1.25.8
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - run: make build-apigateway-lambda
      - run: make build-dynamostream-lambda
      - run: go version
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: build
          path: |
            ./handler.zip
            ./stream.zip
  deploy_dev:
    runs-on: ubuntu-latest
    environment: dev
    needs: [build]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: 1.25.8
      - uses: actions/download-artifact@v4.3.0
        with:
          name: build
      - uses: pulumi/actions@v4
        with:
          pulumi-version: 3.244.0
      - run: cd infrastructure && pulumi login ${{ secrets.PULUMI_CLOUD_URL }} && cd ..
      - run: cd infrastructure && pulumi up --stack dev --non-interactive --yes && cd ..
      - name: Verify deployed API (/ping)
        run: |
          INVOCATION_URL=$(cd infrastructure && pulumi stack output "invocation URL" --stack dev)
          PING_URL=$(echo "$INVOCATION_URL" | sed 's|/{message}$|/ping|')
          echo "Calling $PING_URL"
          curl --fail --show-error --silent "$PING_URL"
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
  deploy_prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    needs: [build]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: 1.25.8
      - uses: actions/download-artifact@v4.3.0
        with:
          name: build
      - uses: pulumi/actions@v4
        with:
          pulumi-version: 3.244.0
      - run: cd infrastructure && pulumi login ${{ secrets.PULUMI_CLOUD_URL }} && cd ..
      - run: cd infrastructure && pulumi up --stack prod --non-interactive --yes && cd ..
      - name: Verify deployed API (/ping)
        run: |
          INVOCATION_URL=$(cd infrastructure && pulumi stack output "invocation URL" --stack prod)
          PING_URL=$(echo "$INVOCATION_URL" | sed 's|/{message}$|/ping|')
          echo "Calling $PING_URL"
          curl --fail --show-error --silent "$PING_URL"
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
