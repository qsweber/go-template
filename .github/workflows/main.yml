name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: 1.25.8
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './cdk/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - run: make build-apigateway-lambda
      - run: make build-dynamostream-lambda
      - run: go version
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: build
          path: |
            ./handler.zip
            ./stream.zip
  cdk-checks:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: 1.25.8
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4.3.0
        with:
          name: build
      - name: Check formatting (cdk)
        run: |
          UNFORMATTED=$(gofmt -l $(find ./cdk -name '*.go' -not -path './cdk/node_modules/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Run go vet (cdk)
        run: cd cdk && go vet .
      - name: Install CDK CLI
        run: cd cdk && npm ci
      - name: Validate CDK app synthesizes
        run: cd cdk && npx cdk synth --all
  deploy_dev:
    runs-on: ubuntu-latest
    environment: dev
    needs: [build, cdk-checks]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: 1.25.8
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4.3.0
        with:
          name: build
      - name: Install CDK CLI
        run: cd cdk && npm ci
      - name: Deploy dev stack
        run: cd cdk && npx cdk deploy go-template-dev --require-approval never
      - name: Verify deployed API (/ping)
        run: |
          CUSTOM_DOMAIN_URL=$(aws cloudformation describe-stacks --stack-name go-template-dev --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='CustomDomainURL'].OutputValue" --output text)
          PING_URL=$(echo "$CUSTOM_DOMAIN_URL" | sed 's|/{message}$|/ping|')
          PING_URL="${PING_URL}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Calling $PING_URL"
          curl --fail --show-error --silent "$PING_URL"
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
  deploy_prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    needs: [build, cdk-checks]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: 1.25.8
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4.3.0
        with:
          name: build
      - name: Install CDK CLI
        run: cd cdk && npm ci
      - name: Deploy prod stack
        run: cd cdk && npx cdk deploy go-template-prod --require-approval never
      - name: Verify deployed API (/ping)
        run: |
          CUSTOM_DOMAIN_URL=$(aws cloudformation describe-stacks --stack-name go-template-prod --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='CustomDomainURL'].OutputValue" --output text)
          PING_URL=$(echo "$CUSTOM_DOMAIN_URL" | sed 's|/{message}$|/ping|')
          PING_URL="${PING_URL}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Calling $PING_URL"
          curl --fail --show-error --silent "$PING_URL"
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
