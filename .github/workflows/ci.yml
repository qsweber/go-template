name: CI Workflow

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
        description: "CDK stack environment suffix (dev or prod)"
      environment:
        required: true
        type: string
        description: "GitHub environment name (dev or prod)"
      run-deploy:
        required: false
        type: boolean
        default: true
        description: "Whether to run the deploy job"

permissions:
  id-token: write # for AWS OIDC (aws-actions/configure-aws-credentials)
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.8
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './cdk/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - run: make build-apigateway-lambda
      - run: make build-dynamostream-lambda
      - run: go version
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            ./handler.zip
            ./stream.zip

  cdk-checks:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.8
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: build
      - name: Check formatting (cdk)
        run: |
          UNFORMATTED=$(gofmt -l $(find ./cdk -name '*.go' -not -path './cdk/node_modules/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Run go vet (cdk)
        run: cd cdk && go vet .
      - name: Install CDK CLI
        run: cd cdk && npm ci
      - name: Validate CDK app synthesizes
        run: cd cdk && npx cdk synth --all

  deploy:
    runs-on: ubuntu-latest
    needs: [build, cdk-checks]
    if: ${{ inputs.run-deploy }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.8
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::120356305272:role/github-actions-deploy
          aws-region: us-west-2
      - name: Install CDK CLI
        run: cd cdk && npm ci
      - name: Deploy stack
        run: cd cdk && npx cdk deploy go-template-${{ inputs.stack }} --require-approval never
      - name: Verify deployed API (/ping)
        run: |
          STACK_NAME=go-template-${{ inputs.stack }}
          CUSTOM_DOMAIN_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='CustomDomainURL'].OutputValue" --output text)
          # Fall back to the execute-api URL when the stack has no custom domain.
          if [ -z "$CUSTOM_DOMAIN_URL" ] || [ "$CUSTOM_DOMAIN_URL" = "None" ]; then
            CUSTOM_DOMAIN_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='InvocationURL'].OutputValue" --output text)
          fi
          PING_URL=$(echo "$CUSTOM_DOMAIN_URL" | sed 's|/{message}$|/ping|')
          PING_URL="${PING_URL}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Calling $PING_URL"
          curl --fail --show-error --silent "$PING_URL"
